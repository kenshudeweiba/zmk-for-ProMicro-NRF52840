# 蓝牙
CONFIG_ZMK_BLE=y
CONFIG_BT_DEVICE_NAME="batoid43"
CONFIG_BT_BAS=y
# CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y

# ZMK Studio
CONFIG_ZMK_STUDIO=y

# 鼠标功能（ZMK Studio 里分配 &mkp/&mmv/&msc 所需）
CONFIG_ZMK_POINTING=y

# 存储
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_BT_SETTINGS=y

# 休眠
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# 眼睛灯：打字速度(WPM)判断 turbo、HID 指示灯(caps lock)状态
CONFIG_ZMK_WPM=y
CONFIG_ZMK_HID_INDICATORS=y
