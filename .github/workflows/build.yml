name: Build ZMK firmware
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3

  release:
    name: Publish firmware to Release
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all firmware artifacts
        uses: actions/download-artifact@v4
        with:
          path: firmware
          merge-multiple: true
      - name: List firmware files
        run: find firmware -type f -printf '%P  %s bytes\n'
      - name: Publish / update main Release (daily firmware only)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: zmk-studio-firmware
          name: ZMK Studio firmware (zmk-studio)
          body: |
            Auto-built from branch `zmk-studio`.

            - `*-nosd.uf2`: app@0x1000, NO SoftDevice, USB-only (no Bluetooth). For boards reporting "SoftDevice: not found".
            - `*-sd.uf2`: app@0x26000, requires S140 SoftDevice (nice!nano v1 / most Pro Micro clones).

            Settings-reset tools are in a SEPARATE release `zmk-studio-tools` - do NOT flash them as daily firmware.
          files: firmware/my48-*.uf2
      - name: Publish / update tools Release (NOT daily firmware)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: zmk-studio-tools
          name: ZMK Studio maintenance tools - DO NOT flash as daily firmware
          body: |
            These erase ALL settings on boot: BLE bonds, ZMK Studio keymap, everything.
            Flash one, let it erase once, then immediately flash your normal firmware back.

            - `settings_reset-nice_nano-nosd.uf2`: for the NoSD partition layout.
            - `settings_reset-nice_nano-sd.uf2`: for the SD partition layout.
          files: firmware/settings_reset-*.uf2
